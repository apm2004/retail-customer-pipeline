name: Customer Processing Pipeline
on:
  push:
    branches:
      - main
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying to DEV"

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: QA
    steps:
      - run: echo "Deploying to QA"

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - run: echo "Deploying to PROD"
  
