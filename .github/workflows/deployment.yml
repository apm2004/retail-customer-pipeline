
name: Retail Data Pipeline CI-CD

on:
  push:
    branches:
      - develop
      - qa
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  testing:
    name: 1. Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Customer Processing
        run: python customer_processing.py

      - name: Run PyTest
        run: pytest -v


  databricks-connection:
    name: 2. Databricks Connection
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks Connection
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

        run: databricks workspace list /


  dev:
    name: 3. Deploy DEV
    needs: databricks-connection
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Deploy to DEV
        run: echo "Retail Data Pipeline deployed to DEV"


  qa:
    name: 4. Deploy QA
    needs: dev
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Deploy to QA
        run: echo "Retail Data Pipeline deployed to QA"


  prod:
    name: 5. Deploy PROD
    needs: qa
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Deploy to PROD
        run: echo "Retail Data Pipeline deployed to PROD"
